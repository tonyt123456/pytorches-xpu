name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: "" }
          # Built in the manylinux image so the wheel's glibc requirement is old enough for most distros.
          - { os: ubuntu-latest, plat: manylinux2014_x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install build
      - name: Build wheel
        shell: bash
        run: |
          if [ -n "${{ matrix.plat }}" ]; then
            python -m build --wheel -C--build-option=--plat-name=${{ matrix.plat }}
          else
            python -m build --wheel
          fi
      - uses: actions/upload-artifact@v4
        with: { name: "wheel-${{ matrix.os }}", path: dist }

  # Manual runs (Actions > release > Run workflow) publish to TestPyPI to rehearse a release.
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: wheel
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
